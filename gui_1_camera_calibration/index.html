<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GUI 1 — camera calibration</title>
<style>
  :root {
    --bg: #15140f; --bg-elevated: #1e1c15; --text: #f1ede1; --text-dim: #9c9686;
    --accent: #c9a13b; --border: #34311f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 24px 60px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px 0; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 22px 0; }
  .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; }
  .section-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; font-family: var(--mono); }
  .cam-row { display: grid; grid-template-columns: 110px 1fr 90px; gap: 10px; align-items: center; margin-bottom: 8px; }
  .cam-row label { font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); }
  input[type=text], input[type=number] {
    font-family: var(--mono); font-size: 12.5px; padding: 7px 9px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); width: 100%;
  }
  input[type=text]:focus, input[type=number]:focus { outline: none; border-color: var(--accent); }
  .ref-radio { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }
  .params-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 16px; }
  .param { display: flex; flex-direction: column; gap: 4px; }
  .param label { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  button { font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 7px;
    border: 1px solid var(--accent); background: var(--accent); color: #1a1608; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #log { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); background: #100f0b;
    border: 1px solid var(--border); border-radius: 8px; padding: 12px; height: 260px; overflow-y: auto; white-space: pre-wrap; }
  .status-badge { font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border); }
  .status-idle { color: var(--text-dim); }
  .status-running { color: #f4a261; border-color: #f4a261; }
  .status-done { color: #7fd79a; border-color: #7fd79a; }
  .status-error { color: #e88; border-color: #e88; }
  .results img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
  .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .out-path { font-family: var(--mono); font-size: 12px; color: var(--accent); word-break: break-all; margin-top: 8px; }
  .hint { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); line-height: 1.6; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Pipeline stage 1 / 4</p>
  <h1>Checkerboard camera calibration</h1>

  <div class="card">
    <div class="section-label">6 camera videos</div>
    <div id="camRows"></div>
    <div class="hint">enter the full local path to each camera's checkerboard calibration video, and mark which camera is the reference (identity rotation/zero translation in the output).</div>
  </div>

  <div class="card">
    <div class="section-label">Calibration parameters</div>
    <div class="params-grid" id="paramsGrid"></div>
  </div>

  <div class="card">
    <div class="section-label">Output</div>
    <div class="param" style="max-width:300px;">
      <label>output json filename (defaults to today's date)</label>
      <input type="text" id="outputName">
    </div>
  </div>

  <div class="card">
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:12px;">
      <button id="runBtn">Run calibration</button>
      <span class="status-badge status-idle" id="statusBadge">idle</span>
    </div>
    <div id="log"></div>
  </div>

  <div class="card results" id="resultsCard" style="display:none;">
    <div class="section-label">Result</div>
    <div class="out-path" id="outPath"></div>
    <div class="results-grid">
      <div><img id="perspectiveImg"></div>
      <div><img id="topImg"></div>
    </div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8971';
let defaults = null;

const PARAM_FIELDS = [
  ["board_w", "board inner corners (W)"],
  ["board_h", "board inner corners (H)"],
  ["square_size", "square size (m)"],
  ["focal_length_mm", "lens focal length (mm)"],
  ["sensor_width_mm", "sensor width (mm)"],
  ["sensor_height_mm", "sensor height (mm)"],
  ["target_frames", "intrinsics: target diverse frames"],
  ["min_pose_distance", "intrinsics: min pose distance"],
  ["min_trans_distance", "intrinsics: min translation distance"],
  ["sample_every_n", "intrinsics: sample every Nth frame"],
  ["synced_sample_every_n", "extrinsics: sample every Nth frame"],
  ["synced_max_frames", "extrinsics: max synced frame sets"],
  ["outlier_threshold_px", "outlier reprojection threshold (px)"],
];

async function init() {
  defaults = await (await fetch(`${API}/api/defaults`)).json();

  const camRows = document.getElementById('camRows');
  defaults.camera_names.forEach(name => {
    const row = document.createElement('div');
    row.className = 'cam-row';
    row.innerHTML = `
      <label>${name}</label>
      <input type="text" data-cam="${name}" placeholder="/path/to/${name}.mp4">
      <label class="ref-radio"><input type="radio" name="refcam" value="${name}" ${name === defaults.reference_camera ? 'checked' : ''}> reference</label>
    `;
    camRows.appendChild(row);
  });

  const grid = document.getElementById('paramsGrid');
  PARAM_FIELDS.forEach(([key, label]) => {
    const div = document.createElement('div');
    div.className = 'param';
    div.innerHTML = `<label>${label}</label><input type="number" step="any" id="p_${key}" value="${defaults[key]}">`;
    grid.appendChild(div);
  });

  document.getElementById('outputName').value = defaults.output_name;
}

function collectConfig() {
  const cameras = [];
  document.querySelectorAll('[data-cam]').forEach(inp => {
    cameras.push({ name: inp.dataset.cam, video_path: inp.value.trim() });
  });
  const missing = cameras.filter(c => !c.video_path);
  if (missing.length) {
    alert(`Missing video path for: ${missing.map(c => c.name).join(', ')}`);
    return null;
  }
  const refEl = document.querySelector('input[name=refcam]:checked');
  const cfg = {
    cameras,
    reference_camera: refEl ? refEl.value : defaults.reference_camera,
    output_name: document.getElementById('outputName').value.trim(),
  };
  PARAM_FIELDS.forEach(([key]) => {
    cfg[key] = parseFloat(document.getElementById(`p_${key}`).value);
  });
  return cfg;
}

let polling = null;

async function runCalibration() {
  const cfg = collectConfig();
  if (!cfg) return;
  const res = await fetch(`${API}/api/run`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg)
  });
  if (!res.ok) {
    const err = await res.json();
    alert(`Could not start: ${err.error}`);
    return;
  }
  document.getElementById('runBtn').disabled = true;
  document.getElementById('resultsCard').style.display = 'none';
  if (polling) clearInterval(polling);
  polling = setInterval(pollProgress, 800);
}

async function pollProgress() {
  const state = await (await fetch(`${API}/api/progress`)).json();
  const badge = document.getElementById('statusBadge');
  badge.textContent = state.status;
  badge.className = `status-badge status-${state.status}`;
  document.getElementById('log').textContent = state.log.join('\n');
  document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;

  if (state.status === 'done') {
    clearInterval(polling);
    document.getElementById('runBtn').disabled = false;
    document.getElementById('resultsCard').style.display = 'block';
    document.getElementById('outPath').textContent = `saved: ${state.result.json_path}`;
    document.getElementById('perspectiveImg').src = `${API}/files/${state.result.perspective_png}?t=${Date.now()}`;
    document.getElementById('topImg').src = `${API}/files/${state.result.top_view_png}?t=${Date.now()}`;
  } else if (state.status === 'error') {
    clearInterval(polling);
    document.getElementById('runBtn').disabled = false;
  }
}

document.getElementById('runBtn').addEventListener('click', runCalibration);
init();
pollProgress();
</script>
</body>
</html>
